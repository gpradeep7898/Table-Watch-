# Camera definitions committed to the repo. Only the synthetic simulation
# camera lives here. Real cameras are added from the Cameras page (stored in
# the local database) or in configs/cameras.local.yaml (gitignored).
#
# Never put credentials in this file. For RTSP use url_env to read the URL
# from an environment variable defined in .env (gitignored).
cameras:
  - id: sim-cam-1
    name: Synthetic overhead camera (SIMULATED)
    kind: simulation
    anchor: centroid          # overhead view: body center is a good anchor
    zones_file: configs/zones/demo.json

