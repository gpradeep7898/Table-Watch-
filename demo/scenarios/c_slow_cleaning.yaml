  Table 5's guests finish quickly and leave. The table enters
  NEEDS_CLEANING and the cleaning timer starts. Nobody comes, so after the
  configured threshold a CLEANING_OVERDUE escalation fires. The timeout
  never marks the table clean. Only a cleaning confirmation returns it to
  FREE.
